# Docs build for covsight/sphinx-covsight on Forgejo Actions.
#
# THIS IS THE ONLY THING THAT PUBLISHES THESE DOCS. .github/workflows/ci.yml
# builds them too, as a CI check, but it has no publish step. dvkit.org owns all
# documentation: <org>.github.io lands at dvkit.org/<org>/, and a repo's docs
# land at dvkit.org/<org>/<repo>/. dvkit.org is a single Cloudflare Pages
# project and a deploy replaces the WHOLE site, so there is exactly one
# publisher for it and it is host-side.
#
# What happens after this job, all of it host-side:
#
#   docs-fetch covsight/sphinx-covsight main   # artifact -> staging/
#   docs-promote / docs-deploy                 # -> dvkit.org/covsight/sphinx-covsight/
#
# The built HTML leaves as an ARTIFACT and nothing else. This job holds no
# Cloudflare token and mounts nothing: a workflow file is public and editable by
# anyone who can push, and the deploy credential is account-scoped.
#
# Four constraints this file is shaped by:
#
#  1. No third-party actions. A bare `uses:` resolves against code.forgejo.org
#     (Forgejo's DEFAULT_ACTIONS_URL), not github.com, so actions/setup-python
#     does not exist here. The runner's `ubuntu-latest` maps to
#     catthehacker/ubuntu:act-22.04, which carries Python 3.10 -- exactly this
#     package's floor.
#  2. `pip` in that image is 22.0.2 and predates PEP 660, so it cannot do an
#     editable install of a pyproject-only project. A venv with an upgraded pip
#     sidesteps that, and nothing here needs an editable install anyway.
#  3. NO release-authority gate. That switch decides who publishes PACKAGES to
#     PyPI. Docs are not a release: they publish from Forgejo to dvkit.org
#     unconditionally, whichever side holds release authority. Adding the gate
#     here would silently stop docs whenever the switch said "github" -- which,
#     for this repo, it does.
#  4. The artifact name is the `docs-<org>-<repo>` convention docs-fetch matches
#     on, and `path: .../**` makes the build directory the ZIP ROOT --
#     docs-fetch refuses an artifact with no index.html at the top level.

name: Docs

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for internal identifiers in tracked files
        # This repo is published to git.dvkit.org and mirrored to GitHub, so
        # anything committed here is public. Internal host names, tailnet
        # addresses and CGNAT-range IPs must not appear in tracked files.
        run: |
          pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
          # The pattern is itself a match, and it appears in every file in this
          # directory -- so the directory as a whole is excluded, not just this
          # file.
          if git grep -nIE "$pattern" -- . ':!.forgejo/workflows' ; then
            echo "::error::internal identifier found in a tracked file (see matches above)"
            exit 1
          fi
          echo "OK: no internal identifiers in tracked files"

      - name: Install
        # The published site is THREE Sphinx projects (see docs/build.sh): this
        # package's documentation, plus the example specification and the
        # example plan nested under it. The main docs alone would need only the
        # package and the theme, but the example plan really does use MyST,
        # sphinx-needs, sphinx-systemverilog and sphinx-peakrdl -- that is the
        # point of it -- so the full `docs` extra is required here.
        run: |
          python3 -m venv /tmp/docsenv
          /tmp/docsenv/bin/pip install -q --upgrade pip
          /tmp/docsenv/bin/pip install -q ".[docs]"

      - name: Build HTML docs
        # Via the script, not a bare sphinx-build: the main docs link into the
        # two sub-builds with relative hrefs that Sphinx neither resolves nor
        # checks, so building only the main project deploys a doc set whose
        # example links are dead. The script is also what a contributor runs, so
        # CI and a laptop cannot disagree about what "the docs" means.
        run: |
          PATH=/tmp/docsenv/bin:$PATH docs/build.sh docs/_build/html

      - name: Sanity-check the build
        # Sphinx exits 0 on a build that produced almost nothing, and an empty
        # doc set is worse than a failed one because it deploys. Auto-promote
        # means there is no review gate in front of main, so these checks are
        # what stands in its place.
        run: |
          test -s docs/_build/html/index.html \
            || { echo "::error::no index.html in the build output"; exit 1; }
          n=$(find docs/_build/html -name '*.html' | wc -l)
          echo "generated pages: $n"
          [ "$n" -ge 30 ] || { echo "::error::only $n pages built; expected 36 (main docs + both example projects). Refusing to call this a doc set."; exit 1; }
          # The two example projects are separate Sphinx builds nested under the
          # main one. A failure there does not fail the main build, and the page
          # count above is dominated by the generated register HTML, so check
          # for them by name.
          for page in example/spec/uart.html example/plan/feat_baud.html \
                      example/plan/design.html example/plan/testbench.html \
                      example/plan/testplan.json ; do
            test -s "docs/_build/html/$page" \
              || { echo "::error::$page missing; the example did not build into the site"; exit 1; }
          done
          # Citations in the published artifact are absolute urls into this same
          # site, so a renamed spec page rots every one of them silently. Map
          # them back onto the build output and confirm the targets are there.
          /tmp/docsenv/bin/python - <<'PY'
          import json, pathlib, sys
          BASE = "https://dvkit.org/covsight/sphinx-covsight/"
          site = pathlib.Path("docs/_build/html")
          plan = json.loads((site / "example/plan/testplan.json").read_text())
          missing, checked = [], 0
          def walk(goals):
              global checked
              for goal in goals:
                  reqs = list(goal.get("custom", {}).get("covsight", {}).get("requirements", []))
                  for tp in goal.get("testpoints", []):
                      reqs += tp.get("requirements", [])
                  for req in reqs:
                      url = req.get("url", "")
                      if not url.startswith(BASE):
                          continue
                      checked += 1
                      target, _, fragment = url[len(BASE):].partition("#")
                      page = site / target
                      # The anchor is the half that rots silently: a renumbered
                      # rule leaves the page in place and the link still 200s.
                      if not page.is_file() or (
                          fragment and f'id="{fragment}"' not in page.read_text()
                      ):
                          missing.append(url)
                  walk(goal.get("goals", []))
          walk(plan["goals"])
          if missing:
              sys.exit("::error::published citation urls point at pages that do not exist: "
                       + ", ".join(sorted(set(missing))))
          if not checked:
              sys.exit("::error::no published citation urls found; covsight_spec_base_url changed?")
          print(f"OK: {checked} published citation url(s) resolve into the site")
          PY
          # The two reference pages are GENERATED from CONFIG_VALUES, DIRECTIVES
          # and SUBTYPES. They are the part that can come out empty while the
          # build still succeeds, so check them by content rather than trusting
          # the exit status above.
          grep -q 'covsight_env_policy' docs/_build/html/reference/configuration.html \
            || { echo "::error::the configuration reference generated no rows"; exit 1; }
          grep -q 'covsight.testpoint-unmapped' docs/_build/html/reference/directives.html \
            || { echo "::error::the directive/warning reference generated no rows"; exit 1; }

      - name: Upload docs
        # Consumed by the host-side poller: `docs-fetch covsight/sphinx-covsight main`.
        # Note the explicit branch -- docs-fetch defaults to `master` and this
        # repo's default branch is `main`.
        uses: forgejo/upload-artifact@v4
        with:
          name: docs-covsight-sphinx-covsight
          path: docs/_build/html/**
          if-no-files-found: error
