$schema: https://fvutils.github.io/ivpm/ivpm.schema.json

package:
  name: sphinx-covsight
  description: Sphinx extension for authoring verification plans as documents.
  default-dep-set: dev

  dep-sets:
  - name: use
    description: Runtime dependencies plus the optional citation backends.
    deps:
    - { name: sphinx, src: pypi }
    - { name: pyyaml, src: pypi }
    - { name: myst-parser, src: pypi }
    - { name: sphinx-systemverilog, src: pypi }
    - { name: sphinx-peakrdl, src: pypi }
    - { name: sphinx-needs, src: pypi }

  - name: dev
    description: Runtime dependencies plus the test and lint toolchain.
    deps:
    - { name: sphinx, src: pypi }
    - { name: pyyaml, src: pypi }
    - { name: myst-parser, src: pypi }
    - { name: sphinx-systemverilog, src: pypi }
    - { name: sphinx-peakrdl, src: pypi }
    - { name: sphinx-needs, src: pypi }
    - { name: pytest, src: pypi }
    - { name: pytest-cov, src: pypi }
    - { name: jsonschema, src: pypi }
    - { name: ruff, src: pypi }
    - { name: mypy, src: pypi }
    - { name: furo, src: pypi }
